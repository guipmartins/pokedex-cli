<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokédex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main class="device" aria-label="Pokédex">
    <header class="device-top">
      <span class="lamp" id="lamp" aria-hidden="true"></span>
      <span class="brand">Pokédex</span>
      <span class="grille" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    </header>

    <section class="left">
      <div class="art-bezel">
        <div class="art-screen" id="artScreen">
          <span class="dex-no" id="dexNo">#0000</span>
          <img id="artwork" alt="" width="475" height="475">
          <div class="scanline" aria-hidden="true"></div>
          <p class="art-empty" id="artEmpty">Busque um Pokémon pelo nome ou número.</p>
        </div>
      </div>

      <form class="search" id="searchForm" autocomplete="off">
        <label class="sr-only" for="searchInput">Nome ou número</label>
        <input id="searchInput" list="names" placeholder="Nome ou número" spellcheck="false">
        <datalist id="names"></datalist>
        <button type="submit" class="key key-amber">Buscar</button>
      </form>

      <div class="controls">
        <div class="dpad" role="group" aria-label="Navegar pela numeração">
          <button class="key" id="prevBtn" title="Anterior (←)" aria-label="Pokémon anterior">◀</button>
          <button class="key" id="nextBtn" title="Próximo (→)" aria-label="Próximo Pokémon">▶</button>
        </div>
        <button class="key round" id="cryBtn" title="Ouvir o grito" aria-label="Ouvir o grito">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
        </button>
        <button class="key round" id="shinyBtn" title="Versão shiny" aria-pressed="false" aria-label="Alternar versão shiny">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.2 6.6L21 11l-6.8 2.4L12 20l-2.2-6.6L3 11l6.8-2.4z"/></svg>
        </button>
        <button class="key round" id="randomBtn" title="Sortear" aria-label="Sortear um Pokémon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8" cy="8" r="1.6"/><circle cx="16" cy="16" r="1.6"/><circle cx="12" cy="12" r="1.6"/></svg>
        </button>
        <button class="key round" id="scanBtn" title="Identificar por foto (IA)" aria-label="Identificar Pokémon por foto">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 7.2 6H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3.2L15 4H9zm3 4.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zm0 2a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/></svg>
        </button>
        <input type="file" id="fileInput" accept="image/*" hidden>
      </div>
    </section>

    <section class="right">
      <div class="lcd">
        <div class="lcd-head">
          <h1 id="pkName">—</h1>
          <div class="types" id="pkTypes"></div>
        </div>
        <nav class="tabs" role="tablist">
          <button role="tab" aria-selected="true" data-tab="info">Dados</button>
          <button role="tab" aria-selected="false" data-tab="stats">Status</button>
          <button role="tab" aria-selected="false" data-tab="defense">Defesa</button>
          <button role="tab" aria-selected="false" data-tab="evo">Evolução</button>
          <button role="tab" aria-selected="false" data-tab="ai">IA</button>
        </nav>

        <div class="panels">
          <div class="panel" data-panel="info" id="panelInfo"></div>
          <div class="panel" data-panel="stats" id="panelStats" hidden></div>
          <div class="panel" data-panel="defense" id="panelDefense" hidden></div>
          <div class="panel" data-panel="evo" id="panelEvo" hidden></div>
          <div class="panel" data-panel="ai" id="panelAi" hidden>
            <div class="ai-off" id="aiOff" hidden>
              <p><strong>IA desligada.</strong> Crie um arquivo <code>.env</code> na pasta do projeto com
              <code>ANTHROPIC_API_KEY=...</code> ou <code>OPENAI_API_KEY=...</code> e reinicie com
              <code>pokedex web</code>.</p>
            </div>
            <div class="ai-on" id="aiOn">
              <div class="entry">
                <div class="entry-actions">
                  <button class="key key-amber small" id="narrateBtn">Narrar entrada</button>
                  <label class="voice"><input type="checkbox" id="voiceToggle" checked> Ler em voz alta</label>
                </div>
                <p class="entry-text" id="entryText"></p>
              </div>
              <div class="chat" id="chatLog" aria-live="polite"></div>
              <form class="ask" id="askForm" autocomplete="off">
                <label class="sr-only" for="askInput">Pergunte à Pokédex</label>
                <input id="askInput" maxlength="500" placeholder="Pergunte algo sobre este Pokémon">
                <button class="key key-amber small" type="submit">Perguntar</button>
              </form>
              <p class="ai-label" id="aiLabel"></p>
            </div>
          </div>
        </div>
        <p class="status" id="status" role="status"></p>
      </div>
    </section>
  </main>

  <p class="credits">Dados e imagens: <a href="https://pokeapi.co" target="_blank" rel="noopener">PokeAPI</a>.
    Projeto de fã, sem relação com Nintendo, Game Freak ou The Pokémon Company.</p>

  <script src="/static/app.js"></script>
</body>
</html>
